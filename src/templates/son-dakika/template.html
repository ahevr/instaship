<div class="photo sd-photo"><img data-field="photo" alt="" /></div>
<div class="sd-shade"></div>

<header class="sd-top">
  <div class="sd-brand">
    <img class="sd-logo" data-field="logo" alt="" />
    <span data-field="handle"></span>
  </div>
  <span class="sd-date" data-field="date"></span>
</header>

<div class="sd-content" data-move>
  <div class="sd-tag" data-hide-if-empty="tag"><span data-field="tag"></span></div>
  <h1 class="sd-title" data-field="title"></h1>
  <p class="sd-summary" data-field="summary"></p>
  <div class="sd-footer">
    <span data-field="source"></span>
    <span class="sd-cta" data-field="cta"></span>
  </div>
</div>

<div class="sd-bar"></div>
