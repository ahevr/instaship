<div class="bt-accent"></div>
<div class="photo bt-photo"><img data-field="photo" alt="" /></div>

<div class="bt-panel" data-move>
  <div class="bt-tag">
    <span data-field="tag"></span>
    <em data-field="date"></em>
  </div>
  <h1 class="bt-title" data-field="title"></h1>
  <p class="bt-summary" data-field="summary"></p>
  <footer class="bt-footer">

      <img class="bt-logo" data-field="logo" alt="" />
      <span data-field="handle"></span>
    </div>

  </footer>
</div>
